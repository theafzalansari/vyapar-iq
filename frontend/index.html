<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VyaparIQ - AI Business Copilot for Small Businesses</title>
    <meta name="description" content="AI-powered bookkeeping, anomaly detection, and business financial intelligence copilot for small business owners." />
    <!-- Google Fonts: Geist, JetBrains Mono, Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- Theme Pre-hydration: Default to light mode, prevent flash -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vyapariq_theme_preference');
          var theme = (saved === 'dark') ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.classList.remove('light-theme', 'dark-theme', 'light', 'dark');
          document.documentElement.classList.add(theme + '-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
